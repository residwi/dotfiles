set -g default-terminal 'tmux-256color'

# https://catppuccin.com/palette/
# status bar style
set -g status-style 'bg=default,fg=#94e2d5'
set -g window-status-current-style 'fg=#f2cdcd,bold'

# Use r to quickly reload tmux settings
bind r source-file ~/.tmux.conf

# Sessionizer in a centred modal floating pane; click outside to close (tmux 3.8+)
bind F new-pane -O -C -x 80% -y 60% ~/dotfiles/bin/tmux-sessionizer \; move-pane -P centre

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# setup default window size to the smallest attached session
set-window-option -g window-size smallest

# Setup 'y' to yank (copy), just like vim-like
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# set-clipboard external sends the copy to the terminal clipboard via OSC 52, so no pbcopy
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# vim-like line numbers in copy mode: absolute on cursor line, relative elsewhere (tmux 3.7+)
set -g copy-mode-line-numbers hybrid
# Highlight cursor line in copy mode, like vim cursorline; catppuccin surface0 (tmux 3.8+)
set -g copy-mode-current-line-style 'bg=#313244'
# Toggle live refresh in copy mode, for watching logs scroll in (tmux 3.8+)
bind -T copy-mode-vi R send-keys -X refresh-toggle

# seamless navigation between tmux panes and vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l

# Enable mouse support
set -g mouse on

set -g status-right '"#h" %H:%M %d-%b-%y'

# OSC 9;4 progress of each window's active pane as a 5-cell bar, … when indeterminate (tmux 3.7+)
set -g @progress '#{?#{!=:#{pane_pb_state},hidden}, #{?#{==:#{pane_pb_state},indeterminate},…,#{R:▰,#{e|/:#{pane_pb_progress},20}}#{R:▱,#{e|-:5,#{e|/:#{pane_pb_progress},20}}}},}'
set -g window-status-format '#I:#W#{E:@progress}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#W#{E:@progress}#{?window_flags,#{window_flags}, }'

# Length of tmux status line
set -g status-left-length 30

# Make vim work seamlessly with tmux
set -g focus-events on

# Prevent delay after pressing esc key
# credit: https://www.johnhawthorn.com/2012/09/vi-escape-delays/
# and https://unix.stackexchange.com/a/25638/221410
set -s escape-time 0

# Set the terminal window title, see https://github.com/neovim/neovim/issues/12944
set-option -g set-titles on
set -g set-titles-string '#T'

# Set the history limit to a large number
set -g history-limit 50000
