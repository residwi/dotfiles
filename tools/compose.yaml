services:
  mysqldb:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - "${DEVELOPMENT_TOOLS_PATH}/database/mysql/data:/var/lib/mysql"

  postgresdb:
    # PG18 keeps data in /var/lib/postgresql/18/docker; 14/data stays beside it for pg_upgrade
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - "${DEVELOPMENT_TOOLS_PATH}/database/postgresql:/var/lib/postgresql"
      - "/var/run/postgresql:/var/run/postgresql"

  mongodb:
    container_name: mongodb
    # mongo 9 cannot open 4.4 files; old data stays in database/mongodb/data
    image: mongo:9
    ports:
      - 27017:27017
    command: mongod
    volumes:
      - "${DEVELOPMENT_TOOLS_PATH}/database/mongodb/9/data:/data/db"

  redis:
    image: redis:alpine
    ports:
     - "6379:6379"
    volumes:
      - "${DEVELOPMENT_TOOLS_PATH}/redis/redis-data:/data"
